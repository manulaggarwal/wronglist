name: wronglist-check

on: [push, pull_request]

jobs:
  constraints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: node --check bin/wronglist
      - name: Constraints on prose
        run: ./ci/check-constraints.sh patterns templates case-study/before-after README.md LIMITS.md || { echo "::error::wronglist matched in live prose (reviews/ is exempt history) — fix or record in evals/EVALS.md §2"; exit 1; }
      - name: Smoke test — init + check (dirty→1, clean→0)
        run: |
          set -e
          export PATH="$PWD/bin:$PATH"
          T=$(mktemp -d) && cd "$T" && git init -q .
          echo "# t" > README.md && mkdir src
          printf 'const x = "Lorem ipsum placeholder";\n' > src/a.js
          wronglist init >/dev/null
          # init must have proposed the planted violation (sanity)
          grep -q "Lorem ipsum" evals/wronglist.txt
          # dirty → expect exit 1
          if wronglist check src >/dev/null 2>&1; then echo "::error::dirty repo passed check (exit 0) — inverted logic regression"; exit 1; fi
          # clean → expect exit 0
          mkdir lib && echo "const ok = 1;" > lib/b.js
          wronglist check lib
          # CI script agrees
          if ./ci/check-constraints.sh lib >/dev/null 2>&1; then echo "CI clean OK"; else echo "::error::CI script disagrees on clean repo"; exit 1; fi
          echo "✓ smoke test passed: dirty→1, clean→0, CLI≡CI"
      - name: Smoke test — review prints
        run: bin/wronglist review README.md | grep -q "ROUND 1 — ADVERSARIAL"
      - name: Edge tests
        run: |
          set -e
          export PATH="$PWD/bin:$PATH"
          # no-git dir: init must not crash
          N=$(mktemp -d) && (cd "$N" && wronglist init >/dev/null)
          # empty git repo: init succeeds, placeholder entry
          E=$(mktemp -d) && cd "$E" && git init -q .
          wronglist init >/dev/null && [ -f evals/wronglist.txt ]
          # idempotent: second init leaves files untouched
          before=$(md5 -q evals/wronglist.txt 2>/dev/null || md5sum evals/wronglist.txt | cut -d' ' -f1)
          wronglist init >/dev/null
          after=$(md5 -q evals/wronglist.txt 2>/dev/null || md5sum evals/wronglist.txt | cut -d' ' -f1)
          [ "$before" = "$after" ] || { echo "::error::init is not idempotent"; exit 1; }
          # comments-only wronglist → config error 2
          printf '# only comments\n' > evals/wronglist.txt
          wronglist check src >/dev/null 2>&1 && { echo "::error::comments-only wronglist should exit 2"; exit 1; } || [ $? -eq 2 ]
          # CRLF + unicode patterns match correctly
          printf 'sch\u00f6nes Ding\r\n' > evals/wronglist.txt
          echo "ein schönes Ding" > src/x.txt 2>/dev/null || { mkdir src && echo "ein schönes Ding" > src/x.txt; }
          wronglist check src >/dev/null 2>&1 || [ $? -eq 1 ]
          echo "✓ edge tests passed"
      - name: Concurrency + parity tests
        run: |
          set -e
          export PATH="$PWD/bin:$PATH"
          D=$(mktemp -d) && cd "$D" && git init -q .
          echo "# p" > README.md && mkdir src lib
          printf 'const v = "Lorem ipsum x";\n' > src/a.js
          echo "const ok = 1;" > lib/b.js
          wronglist init >/dev/null
          # dirty-case parity: CLI and CI script must BOTH flag src
          wronglist check src >/dev/null 2>&1 && { echo "::error::CLI clean on dirty"; exit 1; } || [ $? -eq 1 ]
          ./ci/check-constraints.sh src >/dev/null 2>&1 && { echo "::error::CI clean on dirty"; exit 1; } || [ $? -eq 1 ]
          # indented entry parity (leading-whitespace stripping)
          printf '   Lorem ipsum\n' > evals/wronglist.txt
          wronglist check src >/dev/null 2>&1 && { echo "::error::indented entry: CLI missed"; exit 1; } || [ $? -eq 1 ]
          ./ci/check-constraints.sh src >/dev/null 2>&1 && { echo "::error::indented entry: CI script missed"; exit 1; } || [ $? -eq 1 ]
          # parallel runs never cross-contaminate (temp isolation)
          # One child bash owns the fan-out + wait; one results file; no reaping races.
          cd "$D"
          bash -c '
            export PATH="'"$PWD/bin"':$PATH"
            OUT="$PWD/.results"; : > "$OUT"
            for i in 1 2 3 4 5 6 7 8; do
              ( wronglist check src >/dev/null 2>&1; echo "dirty:$i:$?" >> "$OUT" ) &
              ( wronglist check lib >/dev/null 2>&1; echo "clean:$i:$?" >> "$OUT" ) &
            done
            wait
          '
          bad=$(grep -v -E "^dirty:[0-9]+:1$|^clean:[0-9]+:0$" .results || true)
          n=$(wc -l < .results)
          [ "$n" = "16" ] || { echo "::error::expected 16 results, got $n"; cat .results; exit 1; }
          [ -z "$bad" ] || { echo "::error::unexpected parallel results:"; echo "$bad"; exit 1; }
          echo "concurrency + parity tests passed"
